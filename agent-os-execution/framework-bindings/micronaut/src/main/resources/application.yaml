#
# Mirrors agent-os-governance-micronaut's own application.yaml - see AgentExecutionMicronautBinding
# and agent-os-execution-orm.xml's own doc comments for why both governance's and execution's own
# entity packages are listed here.
micronaut:
  application:
    name: agent-os-execution-micronaut
  server:
    host: 0.0.0.0
  security:
    enabled: true
    authentication: bearer
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${AGENT_OS_KEYCLOAK_ISSUER:`http://localhost:8080/realms/agent-os`}/protocol/openid-connect/certs
datasources:
  default:
    url: ${AGENT_OS_DATABASE_URL:`jdbc:postgresql://localhost:5432/agent_os`}
    username: ${AGENT_OS_DATABASE_USERNAME:agent_os}
    password: ${AGENT_OS_DATABASE_PASSWORD:agent_os}
    driver-class-name: org.postgresql.Driver
jpa:
  default:
    mapping-resources:
      - META-INF/agent-os-execution-orm.xml
    packages-to-scan:
      - com.forwardmeasure.jpa.identity.entity
      - com.forwardmeasure.agentos.governance.jpa.entity
      - com.forwardmeasure.agentos.execution.jpa.entity
    properties:
      hibernate:
        hbm2ddl:
          auto: none
    entity-scan:
      enabled: true
      packages:
        - com.forwardmeasure.jpa.identity.entity
        - com.forwardmeasure.agentos.governance.jpa.entity
        - com.forwardmeasure.agentos.execution.jpa.entity
agent-os:
  security:
    client-id: ${AGENT_OS_CLIENT_ID:agent-os}
  openworkflow:
    definition-management-base-url: ${AGENT_OS_OPENWORKFLOW_DEFINITION_MANAGEMENT_BASE_URL:`http://localhost:8081`}
    execution-management-base-url: ${AGENT_OS_OPENWORKFLOW_EXECUTION_MANAGEMENT_BASE_URL:`http://localhost:8082`}
    token-endpoint: ${AGENT_OS_OPENWORKFLOW_TOKEN_ENDPOINT:`http://localhost:8080/realms/agent-os/protocol/openid-connect/token`}
    client-id: ${AGENT_OS_OPENWORKFLOW_CLIENT_ID:agent-os}
    client-secret: ${AGENT_OS_OPENWORKFLOW_CLIENT_SECRET}
