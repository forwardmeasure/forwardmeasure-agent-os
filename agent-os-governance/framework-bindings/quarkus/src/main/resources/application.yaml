# Mirrors openworkflow-quarkus-service's own application.yaml shape (same multi-tenancy strategy,
# same env-var-with-default convention) rather than inventing a new one - see
# AgentGovernanceQuarkusBinding's own doc comment.
quarkus:
  application:
    name: agent-os-governance-quarkus
  http:
    host: 0.0.0.0
  datasource:
    db-kind: postgresql
    jdbc:
      url: ${AGENT_OS_DATABASE_URL:jdbc:postgresql://localhost:5432/agent_os}
    username: ${AGENT_OS_DATABASE_USERNAME:agent_os}
    password: ${AGENT_OS_DATABASE_PASSWORD:agent_os}
  oidc:
    auth-server-url: ${AGENT_OS_KEYCLOAK_ISSUER:http://localhost:8080/realms/agent-os}
    application-type: service
  hibernate-orm:
    multitenant: SCHEMA
    packages: com.forwardmeasure.jpa.identity.entity,com.forwardmeasure.agentos.governance.jpa.entity
    schema-management:
      strategy: none
    # Verified live against a real Postgres container (2026-08-28): without this, Quarkus refuses
    # to build the SessionFactory at all - it detects quarkus-rest-jackson's REST-facing
    # ObjectMapper customization and, since agent's governed content/audit-event data are stored as
    # JSON columns, won't guess whether that customization is meant to apply to database JSON too.
    # This service doesn't customize JSON serialization for REST responses in a way that should
    # ever reach database columns, so the plain default mapper is correct here.
    mapping:
      format:
        global: ignore
agent-os:
  security:
    client-id: ${AGENT_OS_CLIENT_ID:agent-os}
  openworkflow:
    definition-management-base-url: ${AGENT_OS_OPENWORKFLOW_DEFINITION_MANAGEMENT_BASE_URL:http://localhost:8081}
    token-endpoint: ${AGENT_OS_OPENWORKFLOW_TOKEN_ENDPOINT:http://localhost:8080/realms/agent-os/protocol/openid-connect/token}
    client-id: ${AGENT_OS_OPENWORKFLOW_CLIENT_ID:agent-os}
    client-secret: ${AGENT_OS_OPENWORKFLOW_CLIENT_SECRET}
