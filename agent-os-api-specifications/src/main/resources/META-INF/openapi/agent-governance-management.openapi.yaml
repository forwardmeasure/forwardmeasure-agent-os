          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication is absent or invalid
          content:
            application/problem+json:
              schema:
