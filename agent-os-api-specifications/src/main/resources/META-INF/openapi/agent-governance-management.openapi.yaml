openapi: 3.1.0
info:
  title: ForwardMeasure Agent OS Governance Management API
  version: 1.0.0
  description: |
    Tenant-scoped, authenticated agent authoring and maker-checker governance.

    Tenant and actor identity are derived from the authenticated security
    context. They are never accepted from request bodies, path parameters, or
    query parameters. Agent coordinates (namespace, name, version) are unique
    within the authenticated tenant and immutable after draft creation.

    Governance follows immutable maker-checker control:
    `draft -> in_review -> approved -> published`, with `deprecated` and
    `archived` as further one-way lifecycle transitions from `published`.
    `return to draft` is the sole recovery path from `in_review` - it covers
    both "needs changes" and reviewer rejection; there is no separate
    terminal-rejected status. The author of a revision cannot approve that
    same revision.

    Publication is synchronous: `publish` validates the approved definition's
    workflow binding directly against OpenWorkflow's public
    definition-management API and, on success, transitions the agent to
    `published` in the same request - there is no queued or pending
    intermediate state.
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
  - url: /
security:
  - BearerAuth: []
tags:
  - name: Agents
    description: Tenant-scoped agent draft authoring
  - name: Agent Governance
    description: Maker-checker review, approval, publication, deprecation, and archival
  - name: Agent Releases
    description: Read-only lookup of currently available (published) agent releases

paths:
  /v1/agents:
    post:
      tags: [Agents]
      operationId: createAgentDraft
      summary: Create an agent draft
      description: >
        Creates a tenant-scoped agent draft owned by the authenticated actor.
        The (namespace, name, version) coordinate must be unique within the
        authenticated tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDraftCreate'
      responses:
        '201':
          description: Agent draft created
          headers:
            ETag:
              $ref: './common-definitions.yaml#/components/headers/ETag'
            Location:
              $ref: './common-definitions.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication is absent or invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated actor is not authorized for the requested resource action
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with resource identity or lifecycle state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is syntactically valid but violates resource constraints
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected error occurred while processing the request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents visible to the authenticated actor
      parameters:
        - $ref: './common-definitions.yaml#/components/parameters/Offset'
        - $ref: './common-definitions.yaml#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: Authorized agent page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication is absent or invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The authenticated actor is not authorized for the requested resource action
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected error occurred while processing the request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

