components:
  securitySchemes:
    BearerAuth:
      $ref: './common-definitions.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    # --- BEGIN shared schemas from common-definitions.yaml ---
    # Real cross-file $refs for the flat ones (openapi-generator 7.24.0's jaxrs-spec
    # generator handles these correctly - verified by actually compiling generated
    # output against them, not assumed). Problem is the sole exception: it has a
    # nested $ref to Violation as a property type, and a cross-file $ref to a schema
    # that itself contains a nested schema $ref is what triggers a real generator bug
    # (miscompiled Map-backed additionalProperties methods on a class that doesn't
    # implement Map). Problem is duplicated locally to work around exactly that;
    # Violation itself is flat and works fine as a real cross-file $ref.
    # common-definitions.yaml remains the canonical source for all of these,
    # including Problem; a structural test asserts Problem's local copy matches it
    # exactly.
    ActorReference:
      $ref: './common-definitions.yaml#/components/schemas/ActorReference'
    Paging:
      $ref: './common-definitions.yaml#/components/schemas/Paging'
    Violation:
      $ref: './common-definitions.yaml#/components/schemas/Violation'
    WorkflowReleaseBinding:
      $ref: './common-definitions.yaml#/components/schemas/WorkflowReleaseBinding'
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlation_id:
          type: string
          nullable: true
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    # --- END shared schemas ---
    AgentStatus:
      type: string
      enum: [draft, in_review, approved, published, deprecated, archived]
    AgentSkill:
      type: object
      additionalProperties: false
      required: [id, name, description]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        inputModes:
          type: array
          items:
            type: string
        outputModes:
          type: array
          items:
            type: string
    AgentProtocols:
      type: object
      additionalProperties: false
      description: At least one of a2a or mcp must be true.
      required: [a2a, mcp]
      properties:
        a2a:
          type: boolean
        mcp:
          type: boolean
    AgentA2uiComponent:
      type: string
      enum: [auto, text_field, text_area, checkbox, choice_picker, date_time, slider, json]
      default: auto
    AgentA2uiFieldPresentation:
      type: object
      additionalProperties: false
      description: >
        Presentation hint for one field. The field it applies to is the key
        this object is keyed under in AgentA2uiPresentation.fields, not a
        property on this object itself.
      properties:
        label:
          type: string
          nullable: true
        helpText:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true
        component:
          $ref: '#/components/schemas/AgentA2uiComponent'
    AgentA2uiPresentation:
      type: object
      additionalProperties: false
      description: Form-level A2UI presentation metadata for agent invocation input.
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        submitLabel:
          type: string
          nullable: true
        fieldOrder:
          type: array
          description: Field names, in display order. Must not contain duplicates.
          items:
            type: string
        fields:
          type: object
          description: Presentation hints keyed by field name.
          additionalProperties:
            $ref: '#/components/schemas/AgentA2uiFieldPresentation'
    AgentDefinitionContent:
      type: object
      additionalProperties: false
      description: >
        The governed content of an agent definition, independent of its
        governance-record wrapper (identity, lifecycle status, owner/reviewer,
        audit timestamps). This is the schema agent-os-schema-validation's
        JSON Schema is generated from (§2.6) - AgentDraftCreate,
        AgentDraftUpdate, and Agent all compose it via allOf below rather
        than each repeating its seven fields, which is exactly the kind of
        duplication §2.6 exists to prevent.
      required: [displayName, skills, inputSchema, outputSchema, protocols, publicUri]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        skills:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgentSkill'
        inputSchema:
          description: JSON Schema for agent invocation input
        outputSchema:
          description: JSON Schema for agent invocation output
        protocols:
          $ref: '#/components/schemas/AgentProtocols'
        a2uiPresentation:
          $ref: '#/components/schemas/AgentA2uiPresentation'
        publicUri:
          type: string
          format: uri
          description: HTTPS-only public discovery/invocation base URI
    AgentDraftCreate:
      description: Coordinates plus AgentDefinitionContent.
      allOf:
        - type: object
          additionalProperties: false
          required: [namespace, name, version]
          properties:
            namespace:
              type: string
              pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
            name:
              type: string
              pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
            version:
              type: string
              pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        - $ref: '#/components/schemas/AgentDefinitionContent'
    AgentDraftUpdate:
      description: >
        Exactly AgentDefinitionContent - coordinates are immutable after
        draft creation and are not part of an update.
      allOf:
        - $ref: '#/components/schemas/AgentDefinitionContent'
    AgentLifecycleAction:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
          nullable: true
    AgentPublishRequest:
      type: object
      additionalProperties: false
      required: [workflowId, revisionId]
      properties:
        workflowId:
          type: string
          format: uuid
          description: OpenWorkflow workflow identity to bind this release to
        revisionId:
          type: string
          format: uuid
          description: >
            Exact published, non-deprecated OpenWorkflow revision to bind this
            release to. The revision digest is resolved from OpenWorkflow, not
            supplied by the caller.
    Agent:
      description: The governance record wrapper (identity, status, provenance) plus AgentDefinitionContent.
      allOf:
        - type: object
          additionalProperties: false
          required: [id, revision, namespace, name, version, status, owner, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            revision:
              type: integer
              format: int32
              minimum: 0
              readOnly: true
            namespace:
              type: string
              readOnly: true
            name:
              type: string
              readOnly: true
            version:
              type: string
              readOnly: true
            status:
              $ref: '#/components/schemas/AgentStatus'
            owner:
              $ref: '#/components/schemas/ActorReference'
            reviewer:
              $ref: '#/components/schemas/ActorReference'
            workflowBinding:
              $ref: '#/components/schemas/WorkflowReleaseBinding'
            agentDefinitionSha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              nullable: true
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            publishedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            deprecatedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            archivedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
        - $ref: '#/components/schemas/AgentDefinitionContent'
    AgentPage:
      type: object
      additionalProperties: false
      required: [data, paging]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        paging:
          $ref: '#/components/schemas/Paging'
    AgentAuditOperation:
      type: string
      enum:
        - created
        - updated
        - review_submitted
        - returned_to_draft
        - approved
        - published
        - deprecated
        - archived
        - deleted
    AgentAuditEvent:
      type: object
      additionalProperties: false
      required: [eventId, agentId, operation, toStatus, actor, correlationId, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
          readOnly: true
        agentId:
          type: string
          format: uuid
          readOnly: true
        operation:
          $ref: '#/components/schemas/AgentAuditOperation'
        fromStatus:
          $ref: '#/components/schemas/AgentStatus'
        toStatus:
          $ref: '#/components/schemas/AgentStatus'
        actor:
          $ref: '#/components/schemas/ActorReference'
        correlationId:
          type: string
          readOnly: true
        definitionSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          readOnly: true
        details:
          type: string
          nullable: true
          readOnly: true
        occurredAt:
          type: string
          format: date-time
          readOnly: true
    AgentAuditEventPage:
      type: object
      additionalProperties: false
      required: [data, paging]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentAuditEvent'
        paging:
          $ref: '#/components/schemas/Paging'
    AgentRelease:
      type: object
      additionalProperties: false
      description: >
        Discovery-facing trim of Agent - omits reviewer identity and audit
        metadata that governance-UI consumers need but invocation/discovery
        consumers do not.
      required: [namespace, name, version, displayName, skills, protocols, publicUri, workflowBinding, agentDefinitionSha256, updatedAt]
      properties:
        namespace:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        version:
          type: string
          readOnly: true
        displayName:
          type: string
          readOnly: true
        description:
          type: string
          nullable: true
          readOnly: true
        skills:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AgentSkill'
        protocols:
          $ref: '#/components/schemas/AgentProtocols'
        publicUri:
          type: string
          format: uri
          readOnly: true
        workflowBinding:
          $ref: '#/components/schemas/WorkflowReleaseBinding'
        agentDefinitionSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    AgentReleasePage:
      type: object
      additionalProperties: false
      required: [data, paging]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentRelease'
        paging:
          $ref: '#/components/schemas/Paging'
