#
# No entities of policy's own - unlike agent-os-execution-micronaut/agent-os-governance-micronaut,
# this datasource/jpa block exists solely for agent-os-micronaut-actor-binding's own DB-backed
# actor lookup.
micronaut:
  application:
    name: agent-os-policy-micronaut
  server:
    host: 0.0.0.0
  security:
    enabled: true
    authentication: bearer
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${AGENT_OS_KEYCLOAK_ISSUER:`http://localhost:8080/realms/agent-os`}/protocol/openid-connect/certs
datasources:
  default:
    url: ${AGENT_OS_DATABASE_URL:`jdbc:postgresql://localhost:5432/agent_os`}
    username: ${AGENT_OS_DATABASE_USERNAME:agent_os}
    password: ${AGENT_OS_DATABASE_PASSWORD:agent_os}
    driver-class-name: org.postgresql.Driver
jpa:
  default:
    mapping-resources:
      - META-INF/agent-os-policy-orm.xml
    packages-to-scan:
      - com.forwardmeasure.jpa.identity.entity
    properties:
      hibernate:
        hbm2ddl:
          auto: none
    entity-scan:
      enabled: true
      packages:
        - com.forwardmeasure.jpa.identity.entity
agent-os:
  security:
    client-id: ${AGENT_OS_CLIENT_ID:agent-os}
  policy:
    opa-base-url: ${AGENT_OS_POLICY_OPA_BASE_URL:`http://localhost:8181`}
    opa-token: ${AGENT_OS_POLICY_OPA_TOKEN:}
