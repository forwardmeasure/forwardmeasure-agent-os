#
# No entities of policy's own - unlike agent-os-execution-spring/agent-os-governance-spring, this
# datasource exists solely for agent-os-spring-actor-binding's own DB-backed actor lookup.
spring:
  application:
    name: agent-os-policy-spring
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  datasource:
    url: ${AGENT_OS_DATABASE_URL:jdbc:postgresql://localhost:5432/agent_os}
    username: ${AGENT_OS_DATABASE_USERNAME:agent_os}
    password: ${AGENT_OS_DATABASE_PASSWORD:agent_os}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AGENT_OS_KEYCLOAK_ISSUER:http://localhost:8080/realms/agent-os}
server:
  address: 0.0.0.0
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
agent-os:
  security:
    client-id: ${AGENT_OS_CLIENT_ID:agent-os}
  policy:
    opa-base-url: ${AGENT_OS_POLICY_OPA_BASE_URL:http://localhost:8181}
    opa-token: ${AGENT_OS_POLICY_OPA_TOKEN:}
