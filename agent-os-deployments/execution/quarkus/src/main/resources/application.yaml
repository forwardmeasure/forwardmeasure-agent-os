#
# Mirrors agent-os-governance-quarkus's own application.yaml - same database (hibernate-orm.packages
# lists both governance's and execution's own entity packages, since AgentExecutionQuarkusBinding
# constructs AgentGovernanceService in-process against the same tables governance itself owns).
quarkus:
  application:
    name: agent-os-execution-quarkus
  http:
    host: 0.0.0.0
  datasource:
    db-kind: postgresql
    jdbc:
      url: ${AGENT_OS_DATABASE_URL:jdbc:postgresql://localhost:5432/agent_os}
    username: ${AGENT_OS_DATABASE_USERNAME:agent_os}
    password: ${AGENT_OS_DATABASE_PASSWORD:agent_os}
  oidc:
    auth-server-url: ${AGENT_OS_KEYCLOAK_ISSUER:http://localhost:8080/realms/agent-os}
    application-type: service
  hibernate-orm:
    multitenant: SCHEMA
    packages: com.forwardmeasure.jpa.identity.entity,com.forwardmeasure.agentos.governance.jpa.entity,com.forwardmeasure.agentos.execution.jpa.entity
    schema-management:
      strategy: none
    # Verified live against a real Postgres container (2026-08-28): see the identical fix and
    # comment in agent-os-governance-quarkus's own application.yaml - same root cause, same fix.
    mapping:
      format:
        global: ignore
agent-os:
  security:
    client-id: ${AGENT_OS_CLIENT_ID:agent-os}
  openworkflow:
    # Real, separately deployed OpenWorkflow services - see AgentExecutionQuarkusBinding's own
    # doc comment on the two resolver producers for why these are distinct.
    definition-management-base-url: ${AGENT_OS_OPENWORKFLOW_DEFINITION_MANAGEMENT_BASE_URL:http://localhost:8081}
    execution-management-base-url: ${AGENT_OS_OPENWORKFLOW_EXECUTION_MANAGEMENT_BASE_URL:http://localhost:8082}
    token-endpoint: ${AGENT_OS_OPENWORKFLOW_TOKEN_ENDPOINT:http://localhost:8080/realms/agent-os/protocol/openid-connect/token}
    client-id: ${AGENT_OS_OPENWORKFLOW_CLIENT_ID:agent-os}
    client-secret: ${AGENT_OS_OPENWORKFLOW_CLIENT_SECRET}
